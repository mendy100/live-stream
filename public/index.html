<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="/manifest.json">
<title>Live Stream</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0a0a;
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .container { padding: 2rem; width: 100%; max-width: 460px; }
  h1 { font-size: 2.2rem; font-weight: 700; margin-bottom: 0.5rem; }
  .subtitle { color: #888; font-size: 1rem; margin-bottom: 2.5rem; }

  .create-box {
    background: #111;
    border: 2px solid #222;
    border-radius: 14px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
  }
  input {
    width: 100%;
    padding: 0.8rem 1rem;
    font-size: 1rem;
    border: 2px solid #252525;
    border-radius: 10px;
    background: #0a0a0a;
    color: #fff;
    outline: none;
    margin-bottom: 1rem;
    text-align: center;
  }
  input:focus { border-color: #444; }
  input::placeholder { color: #555; }
  button {
    width: 100%;
    padding: 1rem;
    font-size: 1.1rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: #e53e3e;
    color: #fff;
    transition: transform 0.15s;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Result card */
  .result {
    display: none;
    background: #111;
    border: 2px solid #222;
    border-radius: 14px;
    padding: 1.5rem;
    text-align: left;
  }
  .result h2 {
    font-size: 1.1rem;
    font-weight: 600;
    margin-bottom: 1rem;
    text-align: center;
    color: #4ade80;
  }
  .link-row {
    margin-bottom: 1rem;
  }
  .link-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #666;
    margin-bottom: 0.3rem;
  }
  .link-value {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .link-value a {
    flex: 1;
    color: #fff;
    font-size: 0.9rem;
    word-break: break-all;
    text-decoration: none;
    background: #0a0a0a;
    padding: 0.5rem 0.7rem;
    border-radius: 8px;
    border: 1px solid #252525;
  }
  .link-value a:hover { border-color: #444; }
  .copy-btn {
    width: auto;
    padding: 0.5rem 0.8rem;
    font-size: 0.8rem;
    background: #222;
    border-radius: 8px;
    flex-shrink: 0;
  }
  .copy-btn:active { background: #333; }

  .key-box {
    background: #1a1200;
    border: 1px solid #433800;
    border-radius: 8px;
    padding: 0.7rem;
    margin-top: 0.5rem;
  }
  .key-box .link-label { color: #facc15; }
  .key-value {
    color: #facc15;
    font-family: monospace;
    font-size: 1rem;
    word-break: break-all;
  }
  .key-warning {
    color: #999;
    font-size: 0.75rem;
    margin-top: 0.4rem;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Live Stream</h1>
  <p class="subtitle">Free audio live streaming. No sign-up.</p>

  <div class="create-box" id="create-box">
    <input type="text" id="stream-name" placeholder="Stream name (optional)" maxlength="50">
    <button id="create-btn">Create Your Stream</button>
  </div>

  <div class="result" id="result">
    <h2>Your stream is ready!</h2>

    <div class="link-row">
      <div class="link-label">Listener link (share this)</div>
      <div class="link-value">
        <a id="listen-link" href="#" target="_blank"></a>
        <button class="copy-btn" onclick="copyText('listen-link')">Copy</button>
      </div>
    </div>

    <div class="link-row">
      <div class="link-label">Direct audio stream (for IVR / players)</div>
      <div class="link-value">
        <a id="stream-link" href="#" target="_blank"></a>
        <button class="copy-btn" onclick="copyText('stream-link')">Copy</button>
      </div>
    </div>

    <div class="link-row">
      <div class="link-label">Broadcast page (you open this to go live)</div>
      <div class="link-value">
        <a id="broadcast-link" href="#" target="_blank"></a>
        <button class="copy-btn" onclick="copyText('broadcast-link')">Copy</button>
      </div>
    </div>

    <div class="key-box">
      <div class="link-label">Broadcast key</div>
      <div class="key-value" id="key-value"></div>
      <div class="key-warning">Save this key! You need it to go live.</div>
    </div>
  </div>
</div>

<script>
  const createBtn = document.getElementById('create-btn');
  const nameInput = document.getElementById('stream-name');
  const createBox = document.getElementById('create-box');
  const result = document.getElementById('result');

  createBtn.addEventListener('click', async () => {
    createBtn.disabled = true;
    createBtn.textContent = 'Creating...';

    try {
      const res = await fetch('/api/channels', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: nameInput.value || 'My Stream' }),
      });
      const ch = await res.json();
      const base = window.location.origin;

      document.getElementById('listen-link').href = `${base}/s/${ch.id}`;
      document.getElementById('listen-link').textContent = `${base}/s/${ch.id}`;

      document.getElementById('stream-link').href = `${base}/s/${ch.id}/stream`;
      document.getElementById('stream-link').textContent = `${base}/s/${ch.id}/stream`;

      document.getElementById('broadcast-link').href = `${base}/s/${ch.id}/broadcast`;
      document.getElementById('broadcast-link').textContent = `${base}/s/${ch.id}/broadcast`;

      document.getElementById('key-value').textContent = ch.broadcastKey;

      createBox.style.display = 'none';
      result.style.display = 'block';
    } catch (err) {
      alert('Error creating stream. Try again.');
      createBtn.disabled = false;
      createBtn.textContent = 'Create Your Stream';
    }
  });

  // PWA service worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }

  function copyText(id) {
    const el = document.getElementById(id);
    const text = el.textContent || el.innerText;
    navigator.clipboard.writeText(text).then(() => {
      const btn = el.parentElement.querySelector('.copy-btn');
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = 'Copy', 1500);
    });
  }
</script>
</body>
</html>
