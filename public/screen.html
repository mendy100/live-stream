<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<title>Stream Screen</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 800px;
    height: 480px;
    overflow: hidden;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0a0a;
    color: #fff;
    -webkit-user-select: none;
    user-select: none;
  }

  /* ---- First-run key entry ---- */
  .setup {
    display: none;
    height: 480px;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 1rem;
    padding: 2rem;
  }
  .setup.active { display: flex; }
  .setup h1 { font-size: 1.4rem; }
  .setup input {
    width: 340px;
    padding: 0.9rem;
    font-size: 1.1rem;
    text-align: center;
    border: 2px solid #252525;
    border-radius: 10px;
    background: #111;
    color: #fff;
    outline: none;
  }
  .setup button {
    width: 340px;
    padding: 0.9rem;
    font-size: 1.05rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    background: #e53e3e;
    color: #fff;
  }
  .setup .hint { color: #666; font-size: 0.8rem; }

  /* ---- Main kiosk layout ---- */
  .kiosk {
    display: none;
    height: 480px;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
    padding: 0.75rem;
  }
  .kiosk.active { display: grid; }

  .col { display: flex; flex-direction: column; gap: 0.75rem; min-height: 0; }

  .card {
    background: #111;
    border: 2px solid #222;
    border-radius: 14px;
    padding: 0.9rem 1rem;
  }
  .card-title {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #666;
    margin-bottom: 0.5rem;
  }

  /* Live status pill (also acts as the start/stop button) */
  .live-pill {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    padding: 0.9rem;
    border-radius: 14px;
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    background: #1a0000;
    border: 2px solid #333;
    color: #666;
    cursor: pointer;
    transition: transform 0.1s;
  }
  .live-pill:active { transform: scale(0.98); }
  .live-pill.on {
    background: #1a0000;
    border-color: #e53e3e;
    color: #fff;
  }
  .live-hint {
    text-align: center;
    font-size: 0.65rem;
    color: #555;
    margin-top: -0.35rem;
  }
  .live-dot {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #555;
    flex-shrink: 0;
  }
  .live-pill.on .live-dot {
    background: #e53e3e;
    box-shadow: 0 0 10px #e53e3ecc;
    animation: pulse 1.4s infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

  /* Pi status */
  .status-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.5rem; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #555; flex-shrink: 0; }
  .dot.green { background: #4ade80; box-shadow: 0 0 8px #4ade8066; }
  .dot.red { background: #ef4444; box-shadow: 0 0 8px #ef444466; }
  .dot.yellow { background: #facc15; box-shadow: 0 0 8px #facc1566; }
  .status-text { font-size: 0.95rem; }
  .status-detail { color: #888; font-size: 0.75rem; }

  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem; margin-top: 0.6rem; }
  .info-item { background: #0a0a0a; border-radius: 8px; padding: 0.4rem 0.6rem; }
  .info-label { font-size: 0.6rem; color: #666; text-transform: uppercase; }
  .info-value { font-size: 0.85rem; margin-top: 0.1rem; }

  /* Listeners */
  .listeners-row { display: flex; align-items: baseline; justify-content: center; gap: 0.5rem; }
  .listeners-count { font-size: 2.4rem; font-weight: 800; line-height: 1; }
  .listeners-label { color: #888; font-size: 0.85rem; }

  /* Talk button */
  .talk-btn {
    flex: 1;
    width: 100%;
    font-size: 1.3rem;
    font-weight: 700;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    background: #222;
    color: #999;
    transition: transform 0.1s, background 0.2s;
  }
  .talk-btn:active { transform: scale(0.98); }
  .talk-btn.talking {
    background: #e53e3e;
    color: #fff;
    animation: pulse 1.4s infinite;
  }
  .meter-wrap {
    height: 8px;
    background: #222;
    border-radius: 4px;
    margin-top: 0.6rem;
    overflow: hidden;
    display: none;
  }
  .meter-wrap.active { display: block; }
  .meter-bar { height: 100%; width: 0%; border-radius: 4px; background: #4ade80; transition: width 0.05s; }

  .connection-lost {
    display: none;
    background: #1a0000;
    border: 2px solid #ef4444;
    border-radius: 10px;
    padding: 0.5rem 0.8rem;
    text-align: center;
    font-size: 0.8rem;
    color: #ef4444;
  }

  /* Stream name + share link card */
  .stream-name-row { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
  .stream-name { font-size: 1rem; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .edit-btn {
    flex-shrink: 0; background: #222; color: #ccc; border: none; border-radius: 6px;
    font-size: 0.7rem; padding: 0.3rem 0.5rem; cursor: pointer;
  }
  .share-link {
    margin-top: 0.5rem; background: #0a0a0a; border: 1px solid #252525; border-radius: 8px;
    padding: 0.45rem 0.6rem; font-size: 0.72rem; color: #9ca3af; word-break: break-all;
    cursor: pointer;
  }
  .share-link.copied { color: #4ade80; border-color: #4ade80; }

  /* Rename modal */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    align-items: center; justify-content: center; z-index: 1000;
  }
  .modal-overlay.active { display: flex; }
  .modal-box {
    background: #151515; border: 2px solid #333; border-radius: 14px;
    padding: 1.2rem; width: 380px; display: flex; flex-direction: column; gap: 0.8rem;
  }
  .modal-box h3 { font-size: 1rem; }
  .modal-box input {
    padding: 0.7rem; font-size: 1rem; border-radius: 8px; border: 2px solid #333;
    background: #0a0a0a; color: #fff; outline: none;
  }
  .modal-actions { display: flex; gap: 0.6rem; }
  .modal-actions button {
    flex: 1; padding: 0.65rem; font-size: 0.9rem; font-weight: 600;
    border: none; border-radius: 8px; cursor: pointer;
  }
  .modal-save { background: #e53e3e; color: #fff; }
  .modal-cancel { background: #222; color: #ccc; }
</style>
</head>
<body>

<div class="setup" id="setup">
  <h1>Set up this screen</h1>
  <input type="text" id="key-input" placeholder="Enter broadcast key">
  <button id="connect-btn">Connect</button>
  <div class="hint">You only need to do this once — the key is saved on this device.</div>
</div>

<div class="kiosk" id="kiosk">

  <!-- Left column: Stream info + Pi status -->
  <div class="col">
    <div class="connection-lost" id="connection-lost">Connection lost — reconnecting...</div>

    <div class="card">
      <div class="card-title">Stream</div>
      <div class="stream-name-row">
        <div class="stream-name" id="stream-name">My Stream</div>
        <button class="edit-btn" id="rename-btn">Rename</button>
      </div>
      <div class="share-link" id="share-link">Loading link...</div>
    </div>

    <div class="card" style="flex:1">
      <div class="card-title">Raspberry Pi</div>
      <div class="status-row">
        <div class="dot" id="pi-dot"></div>
        <div>
          <div class="status-text" id="pi-status-text">Checking...</div>
          <div class="status-detail" id="pi-status-detail"></div>
        </div>
      </div>
      <div class="info-grid" id="pi-info" style="display:none">
        <div class="info-item">
          <div class="info-label">Connection</div>
          <div class="info-value" id="pi-conn-type">-</div>
        </div>
        <div class="info-item">
          <div class="info-label">WiFi Signal</div>
          <div class="info-value" id="pi-signal">-</div>
        </div>
        <div class="info-item">
          <div class="info-label">Network</div>
          <div class="info-value" id="pi-ssid">-</div>
        </div>
        <div class="info-item">
          <div class="info-label">Uptime</div>
          <div class="info-value" id="pi-uptime">-</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Listeners</div>
      <div class="listeners-row">
        <div class="listeners-count" id="listener-count">0</div>
        <div class="listeners-label">connected</div>
      </div>
    </div>
  </div>

  <!-- Right column: live status + talk -->
  <div class="col">
    <div class="live-pill" id="live-pill">
      <div class="live-dot"></div>
      <span id="live-text">OFFLINE</span>
    </div>
    <div class="live-hint" id="live-hint">Tap to go live</div>

    <div class="card" style="flex:1; display:flex; flex-direction:column;">
      <div class="card-title">Talk from Screen</div>
      <button class="talk-btn" id="talk-btn">Hold to Talk</button>
      <div class="meter-wrap" id="meter-wrap">
        <div class="meter-bar" id="meter-bar"></div>
      </div>
    </div>
  </div>

</div>

<div class="modal-overlay" id="rename-modal">
  <div class="modal-box">
    <h3>Rename stream</h3>
    <input type="text" id="rename-input" maxlength="50" placeholder="Stream name">
    <div class="modal-actions">
      <button class="modal-cancel" id="rename-cancel">Cancel</button>
      <button class="modal-save" id="rename-save">Save</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const pathParts = window.location.pathname.split('/');
  const channelId = pathParts[2];

  const setup = document.getElementById('setup');
  const kiosk = document.getElementById('kiosk');
  const keyInput = document.getElementById('key-input');
  const connectBtn = document.getElementById('connect-btn');
  const connectionLost = document.getElementById('connection-lost');

  const livePill = document.getElementById('live-pill');
  const liveText = document.getElementById('live-text');
  const liveHint = document.getElementById('live-hint');

  const streamNameEl = document.getElementById('stream-name');
  const renameBtn = document.getElementById('rename-btn');
  const shareLink = document.getElementById('share-link');
  const renameModal = document.getElementById('rename-modal');
  const renameInput = document.getElementById('rename-input');
  const renameSave = document.getElementById('rename-save');
  const renameCancel = document.getElementById('rename-cancel');

  const piDot = document.getElementById('pi-dot');
  const piStatusText = document.getElementById('pi-status-text');
  const piStatusDetail = document.getElementById('pi-status-detail');
  const piInfo = document.getElementById('pi-info');
  const piConnType = document.getElementById('pi-conn-type');
  const piSignal = document.getElementById('pi-signal');
  const piSsid = document.getElementById('pi-ssid');
  const piUptime = document.getElementById('pi-uptime');

  const listenerCount = document.getElementById('listener-count');
  const talkBtn = document.getElementById('talk-btn');
  const meterWrap = document.getElementById('meter-wrap');
  const meterBar = document.getElementById('meter-bar');

  let socket = null;
  let isTalking = false;
  let audioCtx = null;
  let mediaStream = null;
  let processor = null;
  let currentKey = null;
  let isLive = false;

  // --- First-run key setup, from URL (?key=) or localStorage ---
  const urlKey = new URLSearchParams(window.location.search).get('key');
  const storageKey = `screen-key-${channelId}`;
  if (urlKey) localStorage.setItem(storageKey, urlKey);
  const savedKey = localStorage.getItem(storageKey);

  if (savedKey) {
    showKiosk();
    connect(savedKey);
  } else {
    setup.classList.add('active');
  }

  // --- Stream name + share link ---
  const base = window.location.origin;
  shareLink.textContent = `${base}/s/${channelId}`;
  shareLink.addEventListener('click', () => {
    navigator.clipboard.writeText(`${base}/s/${channelId}`).then(() => {
      shareLink.classList.add('copied');
      const original = shareLink.textContent;
      shareLink.textContent = 'Copied!';
      setTimeout(() => { shareLink.textContent = original; shareLink.classList.remove('copied'); }, 1500);
    });
  });

  fetch(`/api/channels/${channelId}`)
    .then(r => r.json())
    .then(data => { if (data.name) streamNameEl.textContent = data.name; })
    .catch(() => {});

  renameBtn.addEventListener('click', () => {
    renameInput.value = streamNameEl.textContent;
    renameModal.classList.add('active');
    renameInput.focus();
  });
  renameCancel.addEventListener('click', () => renameModal.classList.remove('active'));
  renameSave.addEventListener('click', () => {
    const newName = renameInput.value.trim();
    if (!newName || !currentKey) { renameModal.classList.remove('active'); return; }
    fetch(`/api/channels/${channelId}/rename`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: newName, key: currentKey }),
    })
      .then(r => r.json())
      .then(data => { if (data.name) streamNameEl.textContent = data.name; })
      .finally(() => renameModal.classList.remove('active'));
  });

  // --- Tap the live pill to explicitly start/stop broadcasting ---
  livePill.addEventListener('click', () => {
    if (!socket || !currentKey) return;
    if (isLive) socket.emit('stop-broadcast');
    else socket.emit('start-broadcast', currentKey);
  });

  connectBtn.addEventListener('click', () => {
    const key = keyInput.value.trim();
    if (!key) return;
    localStorage.setItem(storageKey, key);
    showKiosk();
    connect(key);
  });

  function showKiosk() {
    setup.classList.remove('active');
    kiosk.classList.add('active');
  }

  function connect(key) {
    currentKey = key;
    socket = io({ query: { broadcaster: '1', channel: channelId, type: 'control' } });

    socket.on('connect', () => {
      socket.emit('start-broadcast', key);
      connectionLost.style.display = 'none';
    });

    socket.on('status', (data) => {
      if (data.live !== undefined) setLive(data.live);
    });

    socket.on('auth-error', () => {
      // Saved key is wrong — drop back to setup screen
      localStorage.removeItem(storageKey);
      kiosk.classList.remove('active');
      setup.classList.add('active');
      keyInput.value = '';
      socket.close();
    });

    socket.on('listeners', (n) => {
      listenerCount.textContent = n;
    });

    socket.on('pi-status', (info) => {
      updatePiStatus(info);
    });

    socket.on('disconnect', () => {
      connectionLost.style.display = 'block';
    });

    socket.on('reconnect', () => {
      connectionLost.style.display = 'none';
      socket.emit('start-broadcast', key);
    });
  }

  function setLive(live) {
    isLive = !!live;
    livePill.classList.toggle('on', isLive);
    liveText.textContent = isLive ? 'LIVE' : 'OFFLINE';
    liveHint.textContent = isLive ? 'Tap to stop' : 'Tap to go live';
  }

  function updatePiStatus(info) {
    if (!info) {
      piDot.className = 'dot red';
      piStatusText.textContent = 'Disconnected';
      piStatusDetail.textContent = 'Pi is not connected to server';
      piInfo.style.display = 'none';
      return;
    }

    piDot.className = 'dot green';
    piStatusText.textContent = 'Connected & Streaming';
    piStatusDetail.textContent = `Device: ${info.device || 'unknown'}`;
    piInfo.style.display = 'grid';

    const net = info.network || {};
    piConnType.textContent = net.type === 'wifi' ? 'WiFi' : net.type === 'ethernet' ? 'Ethernet' : net.type;

    if (net.type === 'wifi' && net.signal) {
      const dbm = parseInt(net.signal);
      let quality = 'Excellent';
      if (dbm < -80) quality = 'Weak';
      else if (dbm < -70) quality = 'Fair';
      else if (dbm < -60) quality = 'Good';
      piSignal.textContent = `${net.signal} dBm (${quality})`;
    } else {
      piSignal.textContent = net.type === 'ethernet' ? 'Wired' : '-';
    }

    piSsid.textContent = net.ssid || (net.type === 'ethernet' ? 'Wired' : '-');

    if (info.uptime) {
      const h = Math.floor(info.uptime / 3600);
      const m = Math.floor((info.uptime % 3600) / 60);
      piUptime.textContent = h > 0 ? `${h}h ${m}m` : `${m}m`;
    }
  }

  // Pi status timeout — if no update in 12s, mark as potentially disconnected
  let piTimeout = null;
  const origUpdatePi = updatePiStatus;
  updatePiStatus = function(info) {
    origUpdatePi(info);
    if (info) {
      clearTimeout(piTimeout);
      piTimeout = setTimeout(() => {
        piDot.className = 'dot yellow';
        piStatusText.textContent = 'No recent update';
        piStatusDetail.textContent = 'Pi may have lost connection';
      }, 12000);
    }
  };

  // Talk button
  talkBtn.addEventListener('touchstart', startTalking, { passive: true });
  talkBtn.addEventListener('touchend', stopTalking);
  talkBtn.addEventListener('touchcancel', stopTalking);
  talkBtn.addEventListener('mousedown', startTalking);
  talkBtn.addEventListener('mouseup', stopTalking);
  talkBtn.addEventListener('mouseleave', stopTalking);

  async function startTalking(e) {
    if (isTalking) return;
    isTalking = true;
    talkBtn.classList.add('talking');
    talkBtn.textContent = 'Talking...';
    meterWrap.classList.add('active');

    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioCtx = new AudioContext();
      const source = audioCtx.createMediaStreamSource(mediaStream);
      const analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;

      processor = audioCtx.createScriptProcessor(1024, 1, 1);
      const downsampleRatio = Math.round(audioCtx.sampleRate / 16000);

      processor.onaudioprocess = (e) => {
        if (!isTalking || !socket) return;
        const input = e.inputBuffer.getChannelData(0);
        const output = e.outputBuffer.getChannelData(0);
        output.fill(0);

        const outLen = Math.floor(input.length / downsampleRatio);
        const buf = new Int16Array(outLen);
        for (let i = 0; i < outLen; i++) {
          let s = input[i * downsampleRatio];
          s = Math.max(-1, Math.min(1, s));
          buf[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }
        socket.emit('audio', buf.buffer);
      };

      source.connect(analyser);
      source.connect(processor);
      const silentGain = audioCtx.createGain();
      silentGain.gain.value = 0;
      processor.connect(silentGain);
      silentGain.connect(audioCtx.destination);

      const dataArray = new Uint8Array(analyser.frequencyBinCount);
      function updateMeter() {
        if (!isTalking) return;
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
        const avg = sum / dataArray.length;
        const pct = Math.min(100, (avg / 128) * 100);
        meterBar.style.width = pct + '%';
        meterBar.style.background = pct > 80 ? '#ef4444' : pct > 50 ? '#facc15' : '#4ade80';
        requestAnimationFrame(updateMeter);
      }
      updateMeter();
    } catch (err) {
      alert('Could not access microphone');
      stopTalking();
    }
  }

  function stopTalking() {
    if (!isTalking) return;
    isTalking = false;
    talkBtn.classList.remove('talking');
    talkBtn.textContent = 'Hold to Talk';
    meterWrap.classList.remove('active');

    if (processor) { processor.disconnect(); processor = null; }
    if (audioCtx) { audioCtx.close(); audioCtx = null; }
    if (mediaStream) {
      mediaStream.getTracks().forEach(t => t.stop());
      mediaStream = null;
    }
  }
</script>
</body>
</html>
